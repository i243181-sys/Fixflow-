sonar.projectKey=fixflow
sonar.projectName=FixFlow
sonar.sourceEncoding=UTF-8

sonar.sources=src,backend,scripts
sonar.exclusions=backend/tests/**,scripts/tests/**
sonar.tests=tests,backend/tests,scripts/tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,backend/tests/test_*.py,scripts/tests/test_*.py

sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.python.coverage.reportPaths=coverage/python-coverage.xml
